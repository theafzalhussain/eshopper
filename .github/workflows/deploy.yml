name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "build" ]; then
            echo "Build failed: no build directory"
            exit 1
          fi
          echo "Build successful"

  deploy_to_render:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Trigger Render webhook
        run: |
          WEBHOOK=${{ secrets.RENDER_DEPLOY_HOOK }}
          if [ -z "$WEBHOOK" ]; then
            echo "Skipping Render: webhook not configured"
            exit 0
          fi
          echo "Deploying to Render..."
          curl -s -X POST "$WEBHOOK"
          echo "Render deployment triggered"
        continue-on-error: true

  deploy_to_vercel:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: vercel/action@v5.1.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        continue-on-error: true

  deployment_complete:
    name: Deployment Complete
    runs-on: ubuntu-latest
    needs: [build_and_test, deploy_to_render, deploy_to_vercel]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Deployment workflow complete"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "View results on GitHub Actions"

