name: Deploy

on:
  push:
    branches:
      - main
      - pr/**
      - copilot/**
      - feature/**
      - fix/**
      - hotfix/**
  workflow_dispatch:
    inputs:
      render_deploy_hook:
        description: 'Optional Render deploy hook URL (manual run)'
        required: false
        type: string

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "build" ]; then
            echo "Build failed: no build directory"
            exit 1
          fi
          echo "Build successful"

  deploy_to_render:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: build_and_test
    if: success()
    steps:
      - name: Trigger Render webhook
        env:
          RENDER_SECRET_NAME: RENDER_DEPLOY_HOOK
          RENDER_DEPLOY_HOOK: ${{ secrets[env.RENDER_SECRET_NAME] }}
          MANUAL_RENDER_DEPLOY_HOOK: ${{ github.event.inputs.render_deploy_hook || '' }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            WEBHOOK="$RENDER_DEPLOY_HOOK"
          else
            WEBHOOK="$MANUAL_RENDER_DEPLOY_HOOK"
          fi

          echo "Render deploy branch: ${{ github.ref_name }}"

          if [ -z "$WEBHOOK" ]; then
            echo "Skipping Render: webhook not configured (set secret RENDER_DEPLOY_HOOK or provide workflow input)"
            exit 0
          fi

          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Using manual webhook input fallback"
          fi

          echo "Deploying to Render..."
          curl -sS -X POST "$WEBHOOK" -w "\nHTTP %{http_code}\n"
          echo "Render deployment triggered"
        continue-on-error: false

  deploy_to_vercel:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: build_and_test
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (CLI)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping Vercel: required secrets are missing"
            exit 0
          fi

          echo "Vercel deploy branch: ${{ github.ref_name }}"
          npm install --global vercel

          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Deploying to Vercel PRODUCTION"
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            echo "Deploying to Vercel PREVIEW"
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
        continue-on-error: false

  deployment_complete:
    name: Deployment Complete
    runs-on: ubuntu-latest
    needs: [build_and_test, deploy_to_render, deploy_to_vercel]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Deployment workflow complete"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "View results on GitHub Actions"

