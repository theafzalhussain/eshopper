name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      render_deploy_hook:
        description: 'Optional Render deploy hook URL (manual run)'
        required: false
        type: string

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "build" ]; then
            echo "Build failed: no build directory"
            exit 1
          fi
          echo "Build successful"

  deploy_to_render:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Trigger Render webhook
        env:
          RENDER_DEPLOY_HOOK: ${{ github.event.inputs.render_deploy_hook || '' }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Skipping Render: webhook not configured"
            exit 0
          fi
          echo "Deploying to Render..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deployment triggered"
        continue-on-error: true

  deploy_to_vercel:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (CLI)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping Vercel: required secrets are missing"
            exit 0
          fi
          npm install --global vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        continue-on-error: true

  deployment_complete:
    name: Deployment Complete
    runs-on: ubuntu-latest
    needs: [build_and_test, deploy_to_render, deploy_to_vercel]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Deployment workflow complete"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "View results on GitHub Actions"

