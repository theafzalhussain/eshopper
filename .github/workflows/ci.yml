name: CI

on:
  push:
    branches: ["main", "develop", "pr/**"]
  pull_request:
    branches: ["main"]

jobs:
  build_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Build Output
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build failed: no build directory created"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lh build/ | head -20

