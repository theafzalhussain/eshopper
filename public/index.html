  <!-- ═══════════════════════════════════════════════════════════════════
       APP WEB FONTS — declared here on purpose.

       These families used to be pulled in with @import from inside the
       <style> blocks that Home.jsx, Shop.jsx and SingleProductPage.jsx
       inject at render time. A font referenced that way is only
       discovered *after* React has mounted, so first paint used a
       fallback and every heading was re-laid-out when the real font
       arrived — the reflow behind the CLS on /, /shop/All,
       /single-product and /return-policy.

       Declaring them in the head makes them render-blocking and
       downloaded in parallel with the JS bundle, so they are ready at
       first paint. The @import statements in the components are kept as
       a harmless cache hit. Paired with the *-Fallback metric overrides
       in src/styles/cls-fixes.css, the swap is height-neutral.
       ═══════════════════════════════════════════════════════════════ -->
  <link rel="preload" as="style"
